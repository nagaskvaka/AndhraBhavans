<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Checkout — Andhra Bhavans</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="js/site.js"></script>
  <script src="js/cart.js" defer></script>
  <script src="js/include-nav.js" defer></script>
</head>
<body>
    <header class="site-header">
    <div class="container">
      <h1 class="brand">Andhra Bhavans</h1>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="menu.html">Menu</a>
        <a href="checkout.html">Checkout</a>
        <a href="feedback.html">Feedback</a>
        <a href="contactus.html">Contact</a>
        <a href="admin.html">Admin</a>
      </nav>
    </div>
    </header>
  <!-- shared header/nav 
  <div data-include="nav"></div>-->
  <main class="container">
    <section class="checkout">
      <div id="cart-contents"></div>
      <form id="checkout-form">
        <h3>Customer Details</h3>
        <label>Name <input name="name" required></label>
        <label>Phone <input name="phone" required></label>
        <label>Address <textarea name="address" required></textarea></label>
        <button class="btn" type="submit">Place Order</button>
      </form>
      <div id="checkout-result" aria-live="polite"></div>
    </section>
  </main>
  <footer class="site-footer">
    <div class="container">© Andhra Bhavans</div>
  </footer>
</body>
</html>
