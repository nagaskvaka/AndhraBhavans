<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin — AndhraBhavans</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* small admin-specific overrides */
    .admin-wrap{max-width:1000px;margin:32px auto;padding:20px;background:#fff;border-radius:8px;box-shadow:0 8px 30px rgba(0,0,0,.06)}
    .admin-grid{display:grid;grid-template-columns:1fr 360px;gap:20px}
    .orders-list{max-height:520px;overflow:auto}
    .order-card{border:1px solid #eee;padding:12px;border-radius:6px;margin-bottom:10px}
    pre.json{background:#f8f9fa;padding:10px;border-radius:6px;overflow:auto}
  </style>
</head>
<body>
  <!-- shared header/nav 
  <div data-include="nav"></div>-->
  <main class="admin-wrap">
    <h1>Admin Panel</h1>
    <div class="admin-grid">
      <section>
        <h2>Add menu item</h2>
        <form id="menuForm">
          <label>Title<br><input name="title" required></label><br>
          <label>Price<br><input name="price" type="number" step="0.01" required></label><br>
          <label>Category (comma separated)<br><input name="cat"></label><br>
          <label>Image path<br><input name="img" placeholder="images/G1.jpg"></label><br>
          <label>Description<br><textarea name="desc"></textarea></label><br>
          <button type="submit">Add Item</button>
        </form>

        <h3 style="margin-top:20px">Current menu (preview)</h3>
        <div id="menuPreview"></div>
      </section>

      <aside>
        <h2>Orders</h2>
        <div class="orders-list" id="ordersList">Loading…</div>
        <h3>Order details</h3>
        <div id="orderDetail">Select an order to view details</div>
      </aside>
    </div>
  </main>
  <script src="js/include-nav.js" defer></script>
  <script src="js/admin.js"></script>
</body>
</html>
